<section class="flex flex-col gap-6">
  <header class="text-center">
    <h1 class="text-3xl font-bold">Cocktails</h1>
    <p class="text-base-content/60">Alkoholische Getränke - PIN erforderlich.</p>
  </header>

  @if (unlocked()) {
    <app-cocktail-browser [alcoholic]="true" />
  } @else {
    <app-pin-pad
      title="Alkohol-Passwort eingeben"
      [disabled]="passwordManager.checking()"
      (completed)="onPin($event)"
      (cancel)="cancel()"
    />
    @if (passwordManager.checking()) {
      <app-loading-spinner label="Passwort wird geprüft …" />
    }
  }
</section>
